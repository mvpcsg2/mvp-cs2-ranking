# Cloudflare Worker configuration for the Neon-backed MVP API.
name = "mvp-cs2-api"
main = "src/index.js"
compatibility_date = "2026-11-12"
workers_dev = true

[vars]
CORS_ORIGIN = "https://mvpcsg2.github.io"
AUTH_ADMIN_EMAIL = "semkimr@gmail.com"
AUTH_PUBLIC_URL = "https://mvp-cs2-ranking.pages.dev/"
AUTH_API_URL = "https://mvp-cs2-api.mvpcsgo2.workers.dev"

# Check every 15 minutes; SQL stores each completed Berlin day only once.
[triggers]
crons = ["*/15 * * * *"]
