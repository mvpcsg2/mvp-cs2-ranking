# Cloudflare Worker configuration for the Neon-backed MVP API.
name = "mvp-cs2-api"
main = "src/index.js"
compatibility_date = "2026-11-12"
workers_dev = true

[vars]
CORS_ORIGIN = "https://mvpcsg2.github.io"

# Check every 15 minutes; SQL stores each completed Berlin day only once.
[triggers]
crons = ["*/15 * * * *"]
